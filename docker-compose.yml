version: '3.8'

services:
  db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: seminar_db
    ports:
      - "3307:3306"
    volumes:
      - seminar_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    networks:              # ★ 추가: 사용할 네트워크 지정
      - my_new_network

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: seminar_db
    depends_on:
      - db
    networks:              # ★ 추가: 사용할 네트워크 지정
      - my_new_network

volumes:
  seminar_data:

# ★ 추가: 도커 기본 네트워크(default)를 버리고 새 네트워크 생성
networks:
  my_new_network: